services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ruby}
      POSTGRES_USER: ${POSTGRES_USER:-ruby}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasında tanımlanmalıdır}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend/RubyApi
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__RubyDb: Host=postgres;Port=5432;Database=${POSTGRES_DB:-ruby};Username=${POSTGRES_USER:-ruby};Password=${POSTGRES_PASSWORD}
      Admin__Password: ${ADMIN_PASSWORD:?ADMIN_PASSWORD .env dosyasında tanımlanmalıdır}
      Jwt__Issuer: RubyApi
      Jwt__Key: ${JWT_KEY:?JWT_KEY .env dosyasında tanımlanmalıdır}
      Database__MigrateOnStartup: "true"
      HttpsRedirection__Enabled: "false"
      Frontend__Origins__0: http://localhost:${FRONTEND_PORT:-8080}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
